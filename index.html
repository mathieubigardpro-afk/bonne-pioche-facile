<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bonne Pioche Facile — vos menus de la semaine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7D4453">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pioche Facile">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#FCF5F0; --creme2:#F7ECE7; --blush:#F3E0D6; --blush-d:#EFD8CB;
  --prune:#7D4453; --prune-d:#4A2B38; --prune-l:#6E3B4C; --prune-vd:#38202A;
  --abricot:#D98E6F; --abricot-l:#EFCFC0; --rose:#7E5B66; --rose-l:#C7A4AC; --rose-deco:#A9848B;
  --blanc:#FFFDFB; --olive:#8A9B6E; --tomate:#C0574A;
  --encre:#4A2B38; --encre-2:#8A6570;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --sh-card:0 30px 56px rgba(125,68,83,.30), 0 8px 18px rgba(125,68,83,.16);
  --sh-soft:0 10px 24px rgba(125,68,83,.13);
  --sh-mid:0 16px 34px rgba(125,68,83,.18);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);
  --nav-h:calc(56px + 16px + env(safe-area-inset-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{
  font-family:var(--font-body); background:#E9E2D2; color:var(--encre);
  display:flex; justify-content:center; overscroll-behavior:none; max-width:100vw;
}
#app{
  width:100%; max-width:480px; height:100dvh; position:relative; overflow:hidden;
  background:linear-gradient(165deg,#FAF0EA 0%,#F4DFD3 100%);
  display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(125,68,83,.25);
}
/* ---------- Chrome flottant ---------- */
#topbar{
  position:absolute; top:calc(9px + var(--safe-t)); right:13px; z-index:24;
  display:flex; align-items:center; gap:7px;
  background:rgba(255,253,251,.72); backdrop-filter:blur(6px);
  border-radius:20px; padding:5px 9px; box-shadow:0 6px 16px rgba(125,68,83,.14);
}
#sync-dot{width:10px;height:10px;border-radius:50%;background:#C9C1B2;display:none;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
#btn-settings{background:none;border:none;cursor:pointer;padding:12px 11px;margin:-7px -4px;display:flex;color:var(--prune)}
#btn-settings svg{width:19px;height:19px}
/* ---------- Filigrane one-line ---------- */
.mono-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.mono{position:absolute; opacity:.12; z-index:0; pointer-events:none}
.mono path{fill:none;stroke:var(--prune-l);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.page.nuit .mono path{stroke:#F6E4DC}
/* ---------- Titre vertical ---------- */
.vtitle{
  position:absolute; left:9px; top:calc(52px + var(--safe-t)); bottom:126px;
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-family:var(--font-display); font-weight:600; font-size:34px; line-height:1;
  color:var(--encre); z-index:7; overflow:hidden; max-height:100%;
  text-shadow:0 2px 14px rgba(252,245,240,.65); pointer-events:none;
}
.vtitle.sm{font-size:27px}
/* ---------- Main / pages ---------- */
main{flex:1; position:relative; overflow:hidden; z-index:1}
.page{display:none; position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain; touch-action:pan-y}
.page.active{display:block}
.page.nuit{background:radial-gradient(120% 90% at 50% 30%, #55333F 0%, #4A2B38 45%, #38202A 100%)}
.pad{padding:calc(50px + var(--safe-t)) 18px calc(var(--nav-h) + 26px)}

.caps{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);font-weight:600}
.nuit .caps{color:#B98D97}
h2.section{font-family:var(--font-display); font-weight:600; font-size:24px; margin:12px 0 10px; color:var(--encre)}
.nuit h2.section{color:#FBEFE8}
.sub{font-size:14px; color:var(--encre-2); line-height:1.55}
.nuit .sub{color:#C7A0AA}
.serif{font-family:var(--font-display)}
/* ---------- Nav pilule ---------- */
nav{
  position:absolute; left:22px; right:22px; bottom:calc(16px + var(--safe-b));
  background:var(--prune-d); border-radius:24px; height:56px; z-index:20;
  display:flex; align-items:center; justify-content:space-around;
  box-shadow:0 16px 34px rgba(74,43,56,.36);
}
nav button{
  background:none;border:none;cursor:pointer;padding:0;
  width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  color:#D9AEB8;transition:background .18s,color .18s;position:relative;
}
nav button svg{width:22px;height:22px}
nav button.active{background:var(--abricot);color:#3A2029}
nav button .bdg{
  position:absolute;top:-3px;right:-3px;background:var(--tomate);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
/* ================= MODE FACILE ================= */
.nlbl{display:none}
/* en facile, la barre haute reste : point de synchro + réglages (Aa, duo, sauvegarde) */
body.simple #btn-settings{padding:14px 13px;margin:-8px -6px}
body.simple #btn-settings svg{width:22px;height:22px}
body.simple #sync-dot{width:12px;height:12px}
body.simple nav{height:66px;border-radius:26px}
body.simple nav button{width:auto;min-width:76px;height:56px;flex-direction:column;gap:3px;border-radius:16px;display:flex}
body.simple nav button svg{width:22px;height:22px}
body.simple .nlbl{display:block;font-size:12px;font-weight:700;letter-spacing:.02em}
body.simple nav button[data-tab="favoris"],body.simple nav button[data-tab="recettes"]{display:none}
body.simple{--nav-h:calc(66px + 16px + env(safe-area-inset-bottom))}
body.simple .home-serre,body.simple .cout-chip{display:none}
body.simple .home-mode button{height:70px;font-size:13px}
body.simple .home-q{font-size:33px;min-height:114px}
body.simple .home-foot{font-size:13px;color:#5A4A50}
body.simple .home-tile .ht-k{font-size:12.5px;opacity:1}
body.simple .home-tile .ht-s{font-size:12px;min-height:0;opacity:1}
body.simple .home-tile.c{background:#5C6B44} /* olive foncée : texte crème lisible */
body.simple .home-tile.b{background:#F0C9B6;color:#3A2029} /* abricot clair : texte encre lisible */
body.simple .home-tile.b .stepper button{background:rgba(58,32,41,.14)}
body.simple .stepper button{width:44px;height:44px;min-width:44px;flex-shrink:0;font-size:20px}
body.simple .home-total span{font-size:12.5px;color:var(--prune)}
body.simple .home-date{color:var(--prune)}
body.simple .home-cta{margin-top:auto}
body.simple .sub{font-size:15.5px;color:#5A4A50}
body.simple h2.section{font-size:27px}
body.simple .caps{font-size:12px}
body.simple #btn-super{display:none}
body.simple .act-btn .alab{display:block}
body.simple .deck-actions button{height:64px;min-width:82px;border-radius:20px;flex-direction:column;gap:2px;display:flex}
body.simple .deck-hint{display:none}
body.simple .gn{font-size:15px}
body.simple .gq{font-size:12.5px}
body.simple .gtile{min-height:112px}
body.simple .rayon-title .rname{font-size:17px}
body.simple .stamp.super{display:none}
body.simple .card-foot .caps{font-size:12px;color:var(--prune)}
body.simple .macro-strip .k,body.simple .macro-grid .k{font-size:12px;letter-spacing:.02em}
body.simple .macro-grid{gap:4px}
body.simple .alab{font-size:12.5px}
body.simple .deck-back{width:44px;height:44px}
body.simple .modal-close{width:44px;height:44px}
body.simple .stamp.like{color:#5E7E3B;border-color:#5E7E3B}
body.simple .cell .dnum{color:var(--encre)}
body.simple .cell.today .dnum{color:var(--tomate)}
body.simple .cell .todaytag{font-size:12px;color:#8F3B31}
body.simple .fp .sub a,body.simple .modal-body .sub a{display:inline-block;padding:13px 10px}
body.simple .deck-head .count{background:#F5E7E0}
body.simple .cell.rotcell .rline span{font-size:12px}
body.simple .add-item-row input,body.simple .add-item-row .btn{min-height:44px}
body.simple .cell .dw{color:#5A4A50}
body.simple .cell .lun{color:var(--prune)}
body.simple .bc-grid span{font-size:12px;color:var(--prune)}
body.simple .courses-tot .cs{font-size:12.5px;color:#5A4A50}
body.simple .rayon-title .n{font-size:12px}
body.simple nav button .bdg{font-size:12px;min-width:20px;height:20px;background:#B04A3E}
body.simple .vtitle{display:none}
body.simple .deck-wrap{padding-left:16px}
/* lisibilité mode facile : contrastes et cibles tactiles */
body.simple .gtile:not(.done){color:var(--encre)!important}
body.simple .gtile .gq{opacity:1}
body.simple .gtile .gdel{font-size:15px;opacity:.75;padding:12px 13px}
body.simple .cell .dw{font-size:12px}
body.simple .cell .lun{font-size:12px}
body.simple .cell .swapb{width:44px;height:44px;border-radius:13px}
body.simple .cell .swapb svg{width:17px;height:17px}
body.simple .cell .movb{display:none} /* réordonner les jours : superflu en mode facile, cibles trop petites */
body.simple .r-row .tt .mm{font-size:12.5px}
body.simple .phase-note{font-size:13px}
body.simple #toast{font-size:15.5px}
/* mode facile : pas de favoris (onglet caché), on retire donc tous les cœurs */
body.simple .r-row .heart,body.simple .fav-tag,body.simple .modal-fav,body.simple .mstamp{display:none}
/* texte plus grand (bascule Aa) : on grossit le TEXTE, jamais la structure — aucun zoom, aucune casse */
body.simple.xl .sub{font-size:17px}
body.simple.xl .accroche{font-size:17px;line-height:1.55}
body.simple.xl .home-foot{font-size:14px;min-height:84px}
body.simple.xl h2.section{font-size:29px}
body.simple.xl .modal-body h3{font-size:27px;max-width:none}
body.simple.xl .fp h3{font-size:28px}
body.simple.xl h4.mh{font-size:13px}
body.simple.xl .ing-list li{font-size:16px;padding:8px 0}
body.simple.xl .steps li{font-size:16px;line-height:1.6}
body.simple.xl .batch-tip{font-size:15.5px}
body.simple.xl .macro-grid .v{font-size:23px}
body.simple.xl .macro-grid .k,body.simple.xl .macro-strip .k{font-size:13px}
body.simple.xl .card-body h3{font-size:22px}
body.simple.xl .card .accroche{font-size:15px}
body.simple.xl .card-plate .pl{font-size:15px;max-width:280px}
body.simple.xl .macro-strip .v{font-size:24px}
body.simple.xl .gn{font-size:17px}
body.simple.xl .gq{font-size:14px}
body.simple.xl .rayon-title .rname{font-size:19px}
body.simple.xl .rayon-title .n{font-size:13.5px}
body.simple.xl .cell .dw{font-size:13px}
body.simple.xl .cell .lun{font-size:13.5px}
body.simple.xl .cell.rotcell .rline span{font-size:13.5px}
body.simple.xl .r-row .tt .mm{font-size:14px}
body.simple.xl .courses-tot .cs{font-size:14px}
body.simple.xl .bc-sub{font-size:14px}
body.simple.xl #onboard p{font-size:18px}
body.simple.xl #onboard h2{font-size:33px}
body.simple.xl .fp .accroche{font-size:17px}
body.simple.xl .fp input{font-size:18px}
body.simple.xl .btn{font-size:17px}
body.simple.xl .nlbl{font-size:13px}
body.simple.xl #toast{font-size:17px}
body.simple.xl .phase-note{font-size:14.5px}
body.simple.xl .alab{font-size:13.5px}
body.simple.xl .deck-head .phase-lbl{font-size:17px}
#onboard:focus{outline:none}
/* modale réglages (facile) */
.regl-row{display:flex;align-items:center;gap:12px;background:var(--creme2);border-radius:16px;
  padding:14px 16px;margin-top:16px;cursor:pointer;min-height:56px}
.regl-row .rg-lbl{flex:1;font-weight:700;font-size:16px;color:var(--encre)}
.regl-row .rg-lbl small{display:block;font-weight:500;font-size:13px;color:var(--encre-2);margin-top:2px}
.regl-row.on .hs-sw{background:var(--olive)}
.regl-row.on .hs-sw i{left:21px}
.alab{display:none;font-size:11px;font-weight:800}
/* appairage facile */
.fp h3{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.15;color:var(--encre)}
.fp .accroche{font-size:15px;line-height:1.6;margin-top:10px;color:var(--encre-2);max-width:none}
.fp input{width:100%;border:1.5px solid rgba(45,42,38,.18);border-radius:14px;padding:15px;font-size:17px;margin-top:8px}
.fp .fp-choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.fp .btn{font-size:16.5px;padding:15px 22px}
.fp-code{font-family:var(--font-display);font-weight:900;font-size:34px;color:var(--prune);text-align:center;
  background:var(--creme2);border-radius:18px;padding:18px 12px;margin:14px 0 10px;letter-spacing:.02em}
/* accueil guidé */
#onboard{position:fixed;inset:0;z-index:80;background:linear-gradient(165deg,#FAF0EA 0%,#F4DFD3 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;text-align:center}
#onboard .ob-picto{width:120px;height:120px;border-radius:50%;background:var(--blanc);display:flex;align-items:center;
  justify-content:center;box-shadow:var(--sh-soft);margin-bottom:22px}
#onboard .ob-picto svg{width:64px;height:64px}
#onboard h2{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.15;color:var(--encre);max-width:300px}
#onboard p{font-size:16.5px;line-height:1.6;color:#5A4A50;max-width:300px;margin-top:12px}
#onboard .ob-dots{display:flex;gap:8px;margin:26px 0}
#onboard .ob-dots i{width:10px;height:10px;border-radius:50%;background:rgba(125,68,83,.2)}
#onboard .ob-dots i.on{background:var(--prune)}
#onboard .btn{min-width:220px;font-size:17px;padding:16px 22px}
#onboard .ob-skip{margin-top:10px;background:none;border:none;font-size:15px;min-height:44px;color:var(--prune);text-decoration:underline;cursor:pointer;padding:10px 14px}
/* ---------- Boutons ---------- */
.btn{
  border:none;cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:16px;
  border-radius:16px;padding:14px 22px;transition:transform .1s,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--prune);color:#FCEFE6;box-shadow:0 12px 26px rgba(125,68,83,.30)}
.btn-ghost{background:var(--blanc);color:var(--prune);box-shadow:var(--sh-soft)}
.btn-olive{background:var(--olive);color:#FCEFE6}
.btn-block{width:100%}
.btn-sm{padding:10px 15px;font-size:14px;border-radius:12px}
.nuit .btn-ghost{background:rgba(246,228,220,.08);color:#E8C9BB;box-shadow:none;border:1px solid rgba(246,228,220,.26)}
.nuit .btn-primary{background:var(--abricot);color:#3A2029;box-shadow:0 0 30px rgba(217,142,111,.45)}
/* ---------- Chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
  padding:6px 13px;border-radius:20px;background:var(--creme2);color:var(--prune);
}
.chip.olive{background:rgba(138,155,110,.20);color:#5D6B45}
.chip.saf{background:rgba(217,142,111,.22);color:#94523A}
.chip.terra{background:var(--prune);color:#FCEFE6}
.nuit .chip{background:rgba(246,228,220,.10);color:#E8C9BB}
/* ---------- Ticket : découpe perforée ---------- */
.cut{position:relative;border-top:2px dashed rgba(125,68,83,.22)}
.cut::before,.cut::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#F6E3D8;top:-11px}
.cut::before{left:-11px}.cut::after{right:-11px}
/* ================= PIOCHE ================= */
#pioche-page.deck-mode{overflow:hidden}
.pioche-setup{padding:calc(54px + var(--safe-t)) 18px calc(var(--nav-h) + 20px);display:flex;flex-direction:column;gap:12px;min-height:100%;justify-content:center}
.hero-card{
  background:linear-gradient(150deg,#7D4453 0%,#96566A 65%,#B06B78 130%);
  border-radius:var(--r-lg);padding:24px 22px;color:#FCEFE6;box-shadow:0 22px 44px rgba(125,68,83,.34);
  position:relative;overflow:hidden;
}
.hero-card::after{content:'';position:absolute;inset:8px;border:2px dashed rgba(252,239,230,.42);border-radius:16px;pointer-events:none}
.hero-card h1{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.1}
.hero-card p{font-size:14.5px;margin-top:10px;opacity:.94;line-height:1.55;font-weight:500}
.hero-emoji{display:none}
.stepper-row{
  display:flex;align-items:center;justify-content:space-between;background:var(--blanc);
  border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--sh-soft);
}
.stepper-row .lbl{font-weight:700;font-size:15.5px;color:var(--encre)}
.stepper-row .lbl small{display:block;font-weight:500;font-size:12px;color:var(--rose);margin-top:1px}
.stepper{display:flex;align-items:center;gap:11px}
.stepper button{
  width:36px;height:36px;border-radius:12px;border:none;background:var(--creme2);
  font-size:19px;font-weight:800;color:var(--prune);cursor:pointer;
}
.stepper .val{font-family:var(--font-display);font-weight:900;font-size:22px;min-width:28px;text-align:center;color:var(--prune)}
/* ---- accueil de la pioche ---- */
.pioche-setup.home{justify-content:flex-start;gap:0;padding-top:calc(30px + var(--safe-t))}
.home-date{font-family:var(--font-display);font-weight:900;font-size:15px;color:var(--abricot);text-transform:uppercase;letter-spacing:.03em}
.home-q{font-family:var(--font-display);font-weight:600;font-size:31px;line-height:1.14;color:var(--encre);margin-top:12px}
.home-q em{font-style:normal;color:var(--abricot)}
.home-tiles{display:flex;gap:9px;margin:26px -18px 0;padding:0 18px}
.home-tile{flex:1;min-width:0;border-radius:24px;padding:13px 11px;position:relative;color:#FCEFE6;
  box-shadow:0 12px 24px rgba(74,43,56,.14)}
/* arrivée en cascade : ça vit, mais les boutons ne bougent plus une fois posés */
.home-date{animation:home-in .5s cubic-bezier(.22,1,.36,1) both}
.home-q{animation:home-in .55s cubic-bezier(.22,1,.36,1) .06s both}
.home-tile{animation:home-in .55s cubic-bezier(.22,1,.36,1) .14s both}
.home-tile:nth-child(2){animation-delay:.22s}
.home-tile:nth-child(3){animation-delay:.30s}
.home-mode{animation:home-in .55s cubic-bezier(.22,1,.36,1) .38s both}
.home-cta{animation:home-in .55s cubic-bezier(.22,1,.36,1) .46s both}
.home-foot{animation:home-in .5s ease .56s both}
@keyframes home-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.home-cta{position:relative;overflow:hidden}
.home-cta::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),transparent);animation:home-shine 4.2s ease-in-out 1.2s infinite}
@keyframes home-shine{0%{left:-60%}45%{left:130%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){
  .home-date,.home-q,.home-tile,.home-mode,.home-cta,.home-foot,.home-total{animation:none}
  .home-mono path{animation:none;stroke-dasharray:none}
  .home-cta::after{display:none}
}
.home-tile.a{background:var(--prune)}
.home-tile.b{background:var(--abricot);color:#3A2029}
.home-tile.c{background:var(--olive)}
.home-tile .ht-ic{position:absolute;right:7px;top:5px;font-size:25px;opacity:.4;line-height:1}
.home-tile .ht-k{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.93}
.home-tile .ht-v{font-family:var(--font-display);font-weight:900;font-size:50px;line-height:.95;margin-top:12px}
.home-tile .ht-s{font-size:10.5px;opacity:.87;margin-top:4px;line-height:1.3;min-height:27px}

.home-mode{display:flex;gap:8px;background:var(--blanc);border-radius:22px;padding:10px;margin-top:auto;box-shadow:var(--sh-soft)}
.home-mode button{flex:1;min-width:0;border:none;border-radius:16px;height:64px;background:none;cursor:pointer;

.home-av{display:flex}
.home-av i{width:23px;height:23px;border-radius:50%;font-size:10.5px;color:#FCEFE6;display:flex;

.home-av i.p1{background:var(--prune)}
.home-av i.p2{background:var(--abricot);color:#3A2029;margin-left:-6px}
.home-av.apart i.p2{margin-left:5px;opacity:.5}
.home-mid{flex:1;min-height:70px;position:relative;display:flex;align-items:center;justify-content:center;margin-top:6px}
.home-mono{position:absolute;width:250px;height:250px;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.15}
.home-mono path{stroke-dasharray:520;animation:home-draw 2.4s cubic-bezier(.4,0,.2,1) .5s both}
@keyframes home-draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
.home-total{position:relative;text-align:center;animation:home-in .6s cubic-bezier(.22,1,.36,1) .34s both}
.home-total b{display:block;font-family:var(--font-display);font-weight:900;font-size:56px;line-height:1;color:var(--prune)}
.home-total span{display:block;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--rose);margin-top:7px}
.home-cta{margin-top:16px}
.home-foot{text-align:center;font-size:11.5px;color:var(--rose);line-height:1.5;margin-top:12px}
.duo-chip{display:flex;align-items:center;gap:7px;margin:10px auto 0;padding:9px 16px;min-height:40px;

.duo-chip svg{width:16px;height:16px;flex-shrink:0}
body.simple .home-foot{display:grid;font-size:14px;min-height:42px}
body.simple .home-mid{min-height:104px;margin:14px 0 10px}

body.simple .home-total b{font-size:50px}
body.simple .home-total span{margin-top:9px}

  body.simple .home-date{font-size:12px}

  body.simple .home-tile .stepper button{width:44px;height:44px;font-size:19px}

  body.simple .home-total b{font-size:30px}

  .home-q{font-size:25px}
  .home-total b{font-size:38px}
  .home-total span{font-size:10px;margin-top:4px}
  .home-mid{min-height:26px}
  .home-tiles{margin-top:16px}
  .home-tile .ht-v{font-size:36px;margin-top:8px}
  .home-tile .ht-s{min-height:0;font-size:9.5px}
  .home-mode button{height:52px;font-size:11.5px}
  .home-serre{padding:8px 13px;margin-top:7px}
  .hs-lbl{font-size:12.5px}
  .hs-lbl small{font-size:10px}
  .home-cta{margin-top:10px}
  .home-cta.btn{padding:11px 22px;font-size:15px}
  .home-foot{display:none}
  .home-tile .ht-v{font-size:42px}
  .home-mode button{height:56px}
  .home-cta{margin-top:14px}
}
/* deck */
.deck-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(44px + var(--safe-t)) 16px 0 40px}
.deck-head{display:flex;align-items:center;gap:8px;padding:0 2px 8px;z-index:6}
.deck-head .dh-mid{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.deck-back{width:40px;height:40px;flex-shrink:0;border:none;border-radius:11px;background:var(--blanc);
  color:var(--prune);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-soft)}
.deck-back svg{width:15px;height:15px}
.deck-head .phase-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-head .phase-lbl{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--encre)}
.phase-note{display:block;font-family:var(--font-body);font-weight:500;font-style:normal;font-size:10.5px;color:var(--rose);line-height:1.25;margin-top:1px;white-space:normal}
body.simple .phase-note{font-size:12px}
.deck-head .count{font-weight:800;font-size:12.5px;color:var(--prune);background:rgba(125,68,83,.10);padding:4px 10px;border-radius:20px}
.progress-dots{display:flex;gap:5px;padding:0 2px 10px;z-index:6}
.progress-dots span{height:5px;flex:1;border-radius:3px;background:rgba(125,68,83,.16);transition:background .3s}
.progress-dots span.on{background:var(--abricot)}
.deck{position:relative;flex:1;min-height:0;z-index:5}
.card{
  position:absolute;inset:0;border-radius:var(--r-lg);background:var(--blanc);
  box-shadow:var(--sh-card);display:flex;flex-direction:column;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  padding:14px 22px 12px;transform:rotate(-1.6deg);
}
.card.dragging{cursor:grabbing;transition:none}
.card.behind{transform:rotate(3.5deg) translate(11px,10px);background:var(--blush);pointer-events:none;box-shadow:var(--sh-soft)}
.card.behind2{transform:rotate(-5deg) translate(-12px,19px);background:var(--blush-d);opacity:.72;pointer-events:none;box-shadow:var(--sh-soft)}
.card.behind .card-inner,.card.behind2 .card-inner{opacity:0}
.card-inner{display:flex;flex-direction:column;flex:1;min-height:0}
.grip{width:40px;height:5px;border-radius:3px;background:#EBD5CA;margin:0 auto 8px;flex-shrink:0}
.chev{position:absolute;top:47%;font-size:21px;color:#D9AEB8;font-weight:700;pointer-events:none}
.chev.l{left:8px}.chev.r{right:8px}
.card-visu{display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:2px 0 6px}
.card-visu .pastille .picto{filter:drop-shadow(0 10px 16px rgba(125,68,83,.22));transform:rotate(-5deg)}
.univers-tag{display:block;text-align:center}
.fav-tag{position:absolute;top:14px;right:16px;font-size:10px;font-weight:700;color:var(--tomate);z-index:3}
.card-body{display:flex;flex-direction:column;flex:1;min-height:0;text-align:center}
.card-body h3{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.2;color:var(--encre);margin:5px auto 7px;max-width:270px}
.card-body .accroche{font-family:var(--font-display);font-style:italic;font-size:14px;line-height:1.5;color:var(--encre-2);max-width:265px;margin:0 auto}
.card .cut{margin:14px -22px 11px}
.macro-strip{display:flex;justify-content:space-between;padding:0 2px}
.macro-strip div{flex:1;text-align:center}
.macro-strip .v{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--prune)}
.macro-strip .k{font-size:9.5px;font-weight:700;color:var(--rose);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:11px}
.card-plate{margin-top:16px;text-align:center}
.card-plate .pl{font-family:var(--font-display);font-style:italic;font-size:13.5px;line-height:1.6;color:var(--encre-2);max-width:250px;margin:6px auto 0}
.card-foot{margin-top:auto;text-align:center;padding-top:10px;border-top:1px solid rgba(125,68,83,.10)}
.card-foot .caps{font-size:9.5px;color:var(--rose-l)}
/* ---- estimation de prix sur la carte ---- */
.card-visu{position:relative}
.cout-chip{position:absolute;right:2px;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:baseline;gap:5px;background:var(--creme2);color:var(--prune);
  font-family:var(--font-display);font-weight:900;font-size:15px;
  padding:6px 11px;border-radius:20px;box-shadow:var(--sh-soft);white-space:nowrap}
.cout-chip small{font-family:var(--font-body);font-weight:700;font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--rose)}
@media (max-height:740px){.cout-chip{font-size:13px;padding:5px 9px}}
/* ---- bascule de mode animée ---- */
.home-mode button{transition:background .28s cubic-bezier(.4,0,.2,1),color .28s}
.home-mode button:active{transform:scale(.97)}
/* pile de variantes : les deux textes occupent la même cellule de grille,
   la hauteur du bloc est donc identique dans les deux modes, au pixel près */
.home-q,.home-foot{display:grid}
.home-q > .qv,.home-foot > .fv{grid-area:1/1;opacity:0;pointer-events:none;visibility:hidden}
.home-q > .qv.on,.home-foot > .fv.on{opacity:1;pointer-events:auto;visibility:visible}
.qv.swapping,.fv.swapping{animation:home-swap .38s cubic-bezier(.22,1,.36,1)}
@keyframes home-swap{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* ---- budget serré sur l'accueil ---- */
.home-serre{display:flex;align-items:center;gap:11px;background:var(--blanc);border-radius:18px;
  padding:10px 14px;margin-top:9px;box-shadow:var(--sh-soft);cursor:pointer;
  animation:home-in .55s cubic-bezier(.22,1,.36,1) .42s both;user-select:none;-webkit-user-select:none}
.hs-lbl{flex:1;font-size:13.5px;font-weight:700;color:var(--encre);line-height:1.2}
.hs-lbl small{display:block;font-weight:500;font-size:11px;color:var(--rose);margin-top:2px}
.hs-sw{width:46px;height:28px;border-radius:14px;background:#E7D8D1;position:relative;flex:0 0 auto;transition:background .25s}
.hs-sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFDFB;
  box-shadow:0 2px 6px rgba(74,43,56,.25);transition:left .25s cubic-bezier(.4,0,.2,1)}
.home-serre.on .hs-sw{background:var(--olive)}
.home-serre.on .hs-sw i{left:21px}
/* ---- animation de match ---- */
.match-pop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  pointer-events:none;background:radial-gradient(85% 60% at 50% 46%,rgba(56,32,42,.66),rgba(56,32,42,.18) 78%,transparent);backdrop-filter:blur(2px);
  animation:mp-bg .35s ease both}
.match-pop.out{animation:mp-out .45s ease both}
@keyframes mp-bg{from{opacity:0}to{opacity:1}}
@keyframes mp-out{from{opacity:1}to{opacity:0}}
.mp-in{text-align:center;animation:mp-pop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes mp-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mp-cards{position:relative;height:86px;margin-bottom:10px}
.mpc{position:absolute;top:6px;left:50%;width:46px;height:66px;border-radius:9px;box-shadow:0 10px 22px rgba(56,32,42,.4)}
.mpc.a{background:var(--prune);animation:mc-a .55s cubic-bezier(.34,1.56,.64,1) both}
.mpc.b{background:var(--abricot);animation:mc-b .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes mc-a{from{transform:translateX(-90px) rotate(-30deg)}to{transform:translateX(-44px) rotate(-12deg)}}
@keyframes mc-b{from{transform:translateX(44px) rotate(30deg)}to{transform:translateX(-2px) rotate(12deg)}}
.mp-heart{position:absolute;left:50%;top:26px;transform:translateX(-50%);font-size:26px;color:#FCEFE6;
  text-shadow:0 4px 12px rgba(56,32,42,.5);animation:mp-heart .6s cubic-bezier(.34,1.56,.64,1) .25s both;z-index:2}
@keyframes mp-heart{from{transform:translateX(-50%) scale(0)}60%{transform:translateX(-50%) scale(1.35)}to{transform:translateX(-50%) scale(1)}}
.mp-in b{display:block;font-family:var(--font-display);font-weight:900;font-size:30px;color:#FCEFE6;
  text-shadow:0 3px 14px rgba(56,32,42,.55)}
.mp-in small{display:block;margin-top:5px;font-size:13px;font-weight:600;color:#F6E4DC;
  text-shadow:0 2px 8px rgba(56,32,42,.5);max-width:250px}
@media (prefers-reduced-motion:reduce){.mpc.a,.mpc.b,.mp-heart,.mp-in{animation-duration:.01s}}
.stamp{
  position:absolute;top:22px;font-family:var(--font-display);font-weight:900;font-size:26px;
  padding:5px 15px;border:3.5px solid;border-radius:12px;transform:rotate(-13deg);opacity:0;
  pointer-events:none;background:rgba(255,253,251,.9);z-index:6;
}
.stamp.like{left:16px;color:var(--olive);border-color:var(--olive)}
.stamp.nope{right:16px;color:var(--tomate);border-color:var(--tomate);transform:rotate(13deg)}
.stamp.super{left:50%;top:38%;transform:translateX(-50%) rotate(-6deg);color:#B8791A;border-color:var(--abricot)}
.hint{text-align:center;padding:10px 0 6px;z-index:6}
.hint b{color:var(--prune)}
.deck-actions{display:flex;align-items:center;justify-content:center;gap:13px;padding:0 0 calc(var(--nav-h) + 12px);z-index:6}
.act-btn{
  width:48px;height:48px;border-radius:15px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--blanc);
  color:var(--prune-l);box-shadow:var(--sh-soft);transition:transform .12s,box-shadow .12s;flex-shrink:0;
}
.act-btn:active{transform:scale(.92)}
.act-btn svg{width:19px;height:19px}
.act-btn.like{background:var(--prune);color:#FCEFE6;width:60px}
.act-btn.super{color:#C08137}
.act-btn.super[disabled]{opacity:.32;pointer-events:none}
.act-btn.info{color:var(--rose)}
.deck-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.deck-empty .emo{font-size:52px}
.recap-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
/* ---------- Lignes recette ---------- */
.r-row{
  display:flex;align-items:center;gap:11px;overflow:hidden;background:var(--blanc);border-radius:var(--r-md);
  padding:9px 13px;box-shadow:var(--sh-soft);cursor:pointer;position:relative;
}
.r-row .thumb{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.r-row .tt{flex:1;min-width:0}
.r-row .tt h4{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.25;margin-bottom:2px;color:var(--encre)}
.r-row .tt .mm{font-size:11px;color:var(--rose);font-weight:600;display:flex;gap:8px;flex-wrap:wrap}
.r-row .heart{background:none;border:none;font-size:19px;cursor:pointer;padding:13px 12px;margin:-8px -4px;flex-shrink:0;color:var(--rose-deco);line-height:1}

/* favoris : cartes */
.r-list.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r-row.fav-card{flex-direction:column;text-align:center;padding:13px 11px 11px;gap:4px}
.r-row.fav-card .thumb{width:54px;height:54px}
.r-row.fav-card .tt h4{font-size:11px}
.r-row.fav-card .tt .mm{justify-content:center;font-size:8.5px}
.r-row.fav-card .heart{position:absolute;top:7px;right:8px;padding:3px}

.cal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cal-head .mn{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--encre);line-height:1}
.wall{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}

.cellfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}

.cell .swapb{

.kudos-btn{

.kudos-partner{font-size:9.5px;color:var(--rose);font-weight:600;text-align:center;margin-top:4px;line-height:1.25}

.blend-row{display:flex;align-items:center;gap:14px;margin-top:9px}
.blend-ring{flex-shrink:0;line-height:0}
.blend-info{flex:1;min-width:0}
.blend-matchs{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--encre);line-height:1.25}
.blend-phrase{font-size:12px;color:var(--encre-2);margin-top:4px;line-height:1.4}
.blend-hist{margin-top:12px;border-top:1px solid #F2E6E0;padding-top:9px}
.bb-bars{display:flex;align-items:flex-end;gap:4px;height:36px}
.bb-bar{flex:1;min-width:5px;max-width:16px;border-radius:3px 3px 0 0;background:var(--rose-l)}
.bb-bar.on{background:var(--prune)}
.bb-legend{margin-top:5px;text-align:center;font-size:9px}
/* ---- Tour du monde du foyer (V1 uniquement) ---- */
.atlas-card{margin-top:14px}
.atlas-map{width:100%;height:auto;display:block;margin-top:8px}
.atlas-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.atlas-autres{margin-top:8px}
/* rétrocompat semaine */
.day-block,.day-lbl,.rot-grid{display:block}
/* ================= COURSES — ticket de caisse ================= */
.receipt{background:var(--blanc);border-radius:var(--r-md);box-shadow:var(--sh-mid);padding:15px 17px;margin-top:10px}
.receipt .cut{margin:11px -17px}
.rayon-block{margin:0}
.rayon-title{
  font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--prune);
  margin:3px 0 3px;display:flex;justify-content:space-between;align-items:baseline;
}
.rayon-title .n{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-family:var(--font-body);font-weight:700}
.course-item{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:11.5px;color:var(--encre);cursor:pointer}
.course-item input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:1.6px solid rgba(125,68,83,.36);flex-shrink:0;margin:0;position:relative;cursor:pointer}
.course-item input:checked{background:var(--olive);border-color:var(--olive)}
.course-item input:checked::after{content:'';position:absolute;left:4.5px;top:2px;width:4px;height:7.5px;border:solid #FCEFE6;border-width:0 2px 2px 0;transform:rotate(40deg)}
.course-item .inm{flex:1}
.course-item .iqt{font-size:10.5px;font-weight:600;color:var(--rose);white-space:nowrap}
.course-item.done .inm{text-decoration:line-through;color:#B29A9B}
.course-item.done .iqt{opacity:.55}
input,textarea{font-size:16px}
.add-item-row{display:flex;gap:7px;margin:8px 0 2px}
.add-item-row input{
  flex:1;border:1.5px solid rgba(125,68,83,.18);border-radius:12px;padding:12px 14px;
  font-family:var(--font-body);font-size:14px;background:var(--creme);color:var(--encre);outline:none;
}
.add-item-row input:focus{border-color:var(--abricot)}
.mult-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--creme2);border-radius:12px;padding:7px 11px;margin-bottom:5px}
.mult-row .nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Liste de courses : tuiles façon caddie ---------- */
.prog-line{height:7px;border-radius:4px;background:rgba(125,68,83,.14);overflow:hidden;margin:12px 0 16px}
.prog-line span{display:block;height:100%;background:var(--olive);border-radius:4px;transition:width .35s}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.gtile{
  position:relative;border:none;cursor:pointer;font-family:var(--font-body);
  border-radius:16px;padding:11px 7px 10px;min-height:104px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;text-align:center;box-shadow:var(--sh-soft);
  transition:transform .12s,box-shadow .12s;
}
.gtile:active{transform:scale(.93)}
.gtile .gic{width:27px;height:27px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.92;margin-bottom:1px}
.gtile.done .gic{opacity:.8}
.gtile .gn{font-size:13px;font-weight:700;line-height:1.22;width:100%;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gtile .gq{font-size:11px;font-weight:600;opacity:.8}
.gtile.done{background:var(--tomate)!important;color:#FFF3EF!important;box-shadow:0 6px 14px rgba(192,87,74,.28)}
.gtile.done .gn{text-decoration:line-through;text-decoration-thickness:1.5px}
.gtile .gdel{position:absolute;top:0;right:0;font-size:13px;opacity:.6;padding:10px 11px;line-height:1}
.rayon-block{margin-bottom:20px}
.rayon-block.caddie{margin-top:24px}
.rayon-block.caddie .rayon-title{color:var(--tomate)}
.rayon-block.caddie .rdot{background:var(--tomate)}
/* ---- carte budget ---- */
.budget-card{background:var(--blanc);border-radius:var(--r-lg);padding:16px 18px 14px;margin-top:18px;box-shadow:var(--sh-soft)}
.bc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bc-tot{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--prune);line-height:1}
.bc-jauge{height:9px;border-radius:5px;background:rgba(125,68,83,.13);overflow:hidden;margin:12px 0 8px}
.bc-jauge span{display:block;height:100%;background:var(--olive);border-radius:5px;transition:width .4s}
.bc-jauge.over span{background:var(--tomate)}
.bc-sub{font-size:12.5px;color:var(--encre-2);line-height:1.45}
.bc-grid{display:flex;gap:8px;margin-top:13px;border-top:1px solid #F2E6E0;padding-top:11px}
.bc-grid div{flex:1;text-align:center}
.bc-grid b{display:block;font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--prune)}
.bc-grid span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);margin-top:3px}
/* ---- budget dans les courses ---- */
.courses-tot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--blanc);
  border-radius:var(--r-md);padding:13px 16px;box-shadow:var(--sh-soft);margin:4px 0 16px}
.courses-tot .ct{font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--prune);line-height:1}
.courses-tot .cs{font-size:11.5px;color:var(--encre-2);text-align:right;line-height:1.35;max-width:52%}
.gtile .gp{font-size:10px;font-weight:700;opacity:.72}
/* ================= RECETTES ================= */
.search-bar{position:sticky;top:0;background:transparent;padding:4px 0 7px;z-index:4}
.search-bar input{
  width:100%;border:none;border-radius:14px;padding:13px 16px;
  font-family:var(--font-body);font-size:14px;background:var(--blanc);color:var(--encre);outline:none;
  box-shadow:var(--sh-soft);
}
.filter-scroll{display:flex;gap:6px;overflow-x:auto;padding:5px 0 3px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.filter-scroll::-webkit-scrollbar{display:none}
.f-chip{
  flex-shrink:0;border:none;background:var(--creme2);color:var(--prune);
  font-size:12px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:var(--font-body);
}
.f-chip.on{background:var(--prune-d);color:#FCEFE6}
.r-list{display:flex;flex-direction:column;gap:8px;padding-top:8px}
/* ================= MODALE ================= */
.modal-back{position:absolute;inset:0;background:rgba(74,43,56,.5);z-index:40;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.modal-back.open{display:flex}
.modal{
  background:var(--blanc);width:100%;max-height:94%;border-radius:26px 26px 0 0;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;
  animation:slideUp .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideUp{from{transform:translateY(60px);opacity:.4} to{transform:none;opacity:1}}
.modal-visu{display:none}
.modal-body{padding:20px 24px 34px;position:relative;overflow-x:clip}
.modal-caps{display:block;padding-right:80px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-body h3{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.15;color:var(--encre);max-width:250px}
.modal-body .accroche{font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--encre-2);line-height:1.5;margin-top:7px;max-width:245px}
.modal-picto{width:72%;filter:drop-shadow(0 8px 14px rgba(125,68,83,.22));transform:rotate(6deg)}
.modal-close{
  position:absolute;top:10px;right:16px;width:40px;height:40px;border-radius:50%;border:none;
  background:var(--creme2);font-size:14px;cursor:pointer;color:var(--prune);font-weight:700;z-index:5;
}
.modal-fav{position:absolute;top:10px;right:58px;width:40px;height:40px;border-radius:50%;border:none;background:var(--creme2);font-size:14px;cursor:pointer;z-index:5;color:var(--tomate)}
.modal-body .cut{margin:14px -24px}
.macro-grid{display:flex;justify-content:space-between;padding:0 2px}
.macro-grid div{flex:1;text-align:center}
.macro-grid .v{font-family:var(--font-display);font-weight:900;font-size:21px;color:var(--prune)}
.macro-grid .k{font-size:9.5px;font-weight:700;color:var(--rose);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
h4.mh{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);font-weight:700;margin:0 0 6px}
.ing-list{display:flex;flex-direction:column;gap:0}
.ing-list li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;font-weight:500;color:var(--encre)}
.ing-list li span:last-child{color:var(--rose);font-weight:600;white-space:nowrap}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:2px}
.steps li{list-style:none;display:flex;gap:11px;font-size:13.5px;line-height:1.55;color:var(--encre-2);padding:4px 0}
.steps li::before{
  counter-increment:st;content:counter(st,decimal-leading-zero);flex-shrink:0;
  color:var(--prune);font-weight:900;font-size:13px;font-family:var(--font-display);margin-top:1px;
}
.batch-tip{font-size:13px;line-height:1.5;color:var(--encre-2);font-weight:500}
.batch-tip.micro{margin-top:8px;color:#4E6234;background:rgba(138,155,110,.13);border-radius:10px;padding:8px 11px}
.batch-tip.micro b{color:#41522B}
.batch-tip b{font-family:var(--font-display);color:var(--prune);font-weight:900}
.mstamp{
  position:absolute;right:24px;bottom:16px;border:2.5px solid var(--abricot);color:var(--abricot);border-radius:12px;
  font-family:var(--font-display);font-weight:900;font-size:13px;letter-spacing:.1em;padding:6px 12px;
  transform:rotate(-9deg);opacity:.85;pointer-events:none;
}
/* ================= MATCH / DUO ================= */
.match-wrap{position:relative;min-height:100%;padding:calc(58px + var(--safe-t)) 20px calc(var(--nav-h) + 24px);display:flex;flex-direction:column;align-items:center;text-align:center}
.match-title{font-family:var(--font-display);font-weight:600;font-size:32px;color:#FBEFE8;margin:14px 0 6px}
.match-cards{display:flex;justify-content:center;margin:14px 0 6px;min-height:150px}
.mc{width:124px;background:var(--blanc);border-radius:16px;box-shadow:0 20px 44px rgba(30,15,22,.5);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:5px}
.mc .picto{width:56px}
.mc b{font-size:11px;color:var(--encre);line-height:1.25}
.mc.a{transform:rotate(-9deg) translateX(10px)}
.mc.b{transform:rotate(8deg) translateX(-10px)}
/* ================= FOYER ================= */
.stile{background:var(--blanc);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh-soft);margin-bottom:10px}
.stile .v{font-family:var(--font-display);font-weight:900;font-size:16px;color:var(--encre);margin-top:3px}
.codebox{font-family:monospace;font-size:15px;color:var(--prune);background:var(--creme2);border-radius:11px;padding:9px 12px;margin-top:6px;text-align:center;letter-spacing:.05em}
.avrow{display:flex;gap:9px;margin-top:8px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;color:var(--prune);font-size:14px;border:2px solid var(--abricot)}
.field-in{width:100%;border:1.5px solid rgba(125,68,83,.18);border-radius:12px;padding:12px 14px;font-family:var(--font-body);font-size:14px;background:var(--creme);color:var(--encre);outline:none;margin-top:6px}
.field-in:focus{border-color:var(--abricot)}
/* ================= Animations ================= */
@keyframes cardIn{from{transform:rotate(-1.6deg) scale(.94) translateY(14px);opacity:.4} to{transform:rotate(-1.6deg) scale(1) translateY(0);opacity:1}}
.card:not(.behind):not(.behind2){animation:cardIn .3s cubic-bezier(.2,.9,.3,1.1)}
.card.dragging{animation:none}
@keyframes popIc{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
nav button.active svg{animation:popIc .3s ease}
@keyframes heartUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-130px) scale(1.25) rotate(12deg);opacity:0}}
.hearts{position:relative;height:0;z-index:5;width:100%}
.hearts span{position:absolute;bottom:0;font-size:22px;animation:heartUp 1.6s ease-out forwards;color:var(--tomate)}
.hearts span:nth-child(1){left:12%;animation-delay:.05s}.hearts span:nth-child(2){left:28%;animation-delay:.35s;font-size:17px}
.hearts span:nth-child(3){left:46%;animation-delay:.15s}.hearts span:nth-child(4){left:62%;animation-delay:.5s;font-size:26px}
.hearts span:nth-child(5){left:78%;animation-delay:.25s}.hearts span:nth-child(6){left:90%;animation-delay:.6s;font-size:16px}
@keyframes confFall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(340deg);opacity:.7}}
.confetti{position:absolute;top:0;z-index:80;pointer-events:none;font-size:20px;animation:confFall 2.4s ease-in forwards}
@keyframes rowIn{from{transform:translateY(8px);opacity:0} to{transform:none;opacity:1}}
.recap-list .r-row,.wall .cell{animation:rowIn .3s ease both}

/* ---------- Couleur : pastilles, bandeaux ---------- */
.pastille{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.pastille .picto{width:76%}
.pastille.big{width:150px;height:150px;box-shadow:0 14px 28px rgba(125,68,83,.16)}
.pastille.big .picto{width:66%}
.pastille.mid{width:86px;height:86px}
.card-band{position:absolute;top:0;left:0;right:0;height:6px;z-index:3}
.modal-band{position:absolute;top:0;left:0;right:0;height:6px;border-radius:26px 26px 0 0}
.r-row .thumb{border-radius:50%}
.r-row .thumb .picto{width:74%}
.cell .pastille{width:54px;height:54px;align-self:center;margin:5px 0 4px}
.cell.rotcell .pastille{width:26px;height:26px;margin:0}
.rayon-title .rdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.rayon-title .rname{display:flex;align-items:center}
.macro-strip .k,.macro-grid .k{color:var(--rose)}
/* ---------- Carte : adaptation aux écrans courts ---------- */
@media (max-height:850px){
  .card-visu .pastille.big{width:120px;height:120px}
  .card-body h3{font-size:18px}
  .card-body .accroche{font-size:13px}
  .card-plate .pl{font-size:12.5px;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .card .cut{margin:11px -22px 9px}
  .macro-strip .v{font-size:20px}
}
@media (max-height:740px){
  .card-visu .pastille.big{width:96px;height:96px}
  .card-plate{display:none}
  .card-body h3{font-size:17px}
  .card-body .accroche{font-size:12.5px;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .hint{padding:6px 0 4px}
}
/* ---------- Toast ---------- */
#toast{
  position:absolute;bottom:92px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--prune-d);color:#FCEFE6;font-size:14px;font-weight:700;
  padding:11px 20px;border-radius:22px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;
  white-space:normal;text-align:center;line-height:1.4;width:max-content;max-width:min(90%,340px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--tomate);color:#FFF3EF}
.hidden{display:none!important}
/* focus clavier visible (accessibilité) */
:focus-visible{outline:2.5px solid var(--prune);outline-offset:2px;border-radius:6px}
input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--prune);outline-offset:1px}
.modal:focus{outline:none}
.empty-state{text-align:center;padding:44px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center;min-height:70vh}
.empty-state .emo{font-size:46px}
.empty-state p{font-size:14px;color:var(--encre-2);line-height:1.55}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="sync-dot" title="Synchronisation"></span>
    <button id="btn-settings" title="Réglages du foyer" aria-label="Réglages du foyer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
    </button>
  </div>

  <main id="main">
    <section class="page active" id="pioche-page"></section>
    <section class="page" id="semaine-page"></section>
    <section class="page" id="courses-page"></section>
    <section class="page" id="favoris-page"></section>
    <section class="page" id="recettes-page"></section>
  </main>

  <nav id="nav" aria-label="Navigation principale">
    <button data-tab="pioche" class="active" title="Pioche" aria-label="Choisir les plats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="11" height="15" rx="2.5" transform="rotate(-8 8 12)"/><rect x="10" y="4" width="11" height="15" rx="2.5" transform="rotate(7 16 12)"/></svg><span class="nlbl">Choisir</span></button>
    <button data-tab="semaine" title="Semaine" aria-label="Menu de la semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3.5 l0 4 M16 3.5 l0 4 M3.5 10.5 l17 0"/></svg><span class="nlbl">Semaine</span></button>
    <button data-tab="courses" title="Courses" aria-label="Liste de courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 l2.4 0 l2.2 10 l9.6 0 l2 -7.6 l-12.6 0"/><circle cx="10" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="16.6" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg><span class="nlbl">Courses</span><span class="bdg hidden" id="courses-bdg"></span></button>
    <button data-tab="favoris" title="Favoris" aria-label="Plats favoris"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 q-7 -4.6 -8.4 -9 q-1 -3.4 1.8 -5 q2.8 -1.6 5 .8 l1.6 1.8 l1.6 -1.8 q2.2 -2.4 5 -.8 q2.8 1.6 1.8 5 q-1.4 4.4 -8.4 9 Z"/></svg></button>
    <button data-tab="recettes" title="Recettes" aria-label="Toutes les recettes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 q-3 -2.4 -8 -1.6 l0 14 q5 -.8 8 1.6 q3 -2.4 8 -1.6 l0 -14 q-5 -.8 -8 1.6 Z"/><path d="M12 6 l0 14"/></svg></button>
  </nav>

  <div class="modal-back" id="modal-back"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

<script>

function mixWhite(hex, ratio) {

/* calcule le blend à partir des votes bruts (ses.votes.p1/p2) et des états de phase (liked+chosenBy) */
function computeBlend(ses, states) {
  const v1 = (ses && ses.votes && ses.votes.p1) || {};
  const v2 = (ses && ses.votes && ses.votes.p2) || {};
  const likesP1 = Object.keys(v1).filter(k => k !== "_");
  const likesP2 = Object.keys(v2).filter(k => k !== "_");
  const set2 = new Set(likesP2);
  const inter = likesP1.filter(id => set2.has(id)).length;
  const union = new Set(likesP1.concat(likesP2)).size;
  const aff = Math.round(100 * inter / Math.max(1, union));
  let matchs = 0, infP1 = 0, infP2 = 0;
  ["diner", "petitdej", "collation"].forEach(cat => {
    const st = states[cat];
    if (!st) return;
    (st.liked || []).forEach(id => {
      const cb = st.chosenBy[id];
      if (cb === "match") matchs++;
      else if (cb === "p1" || cb === "super-p1") infP1++;
      else if (cb === "p2" || cb === "super-p2") infP2++;
    });
  });
  return {
    aff, matchs, infP1, infP2,
    noms: {
      p1: (S.rnames && S.rnames.p1 && S.rnames.p1.nom) || "Joueur 1",
      p2: (S.rnames && S.rnames.p2 && S.rnames.p2.nom) || "Joueur 2"

  };
}

function duoPool(cat) {

  const recent = recentIds();
  const scored = pool.map(id => ({ id, s: (isFav(id) ? 2.2 : 0) + (recent.has(id) ? -3 : 0) + Math.random() * 2 }));
  scored.sort((a, b) => b.s - a.s);

  const size = Math.min(pool.length, Math.max(6, need * 2 + 2));

  ses.votes[ses.current][id] = liked;
  if (liked && ses.phaseLikes[cat][ses.current].indexOf(id) < 0) ses.phaseLikes[cat][ses.current].push(id);
  if (superLike) {
    ses.superUsed = ses.superUsed || { p1: {}, p2: {} };
    if (!ses.superUsed[ses.current][cat] && ses.liked[cat].length < ses.targets[cat] && ses.liked[cat].indexOf(id) < 0) {
      ses.liked[cat].push(id);

  }

    if (ses.current === "p1") { ses.current = "p2"; ses.idx = 0; ses.stage = "handoff"; }

      const matches = ses.cards

  const solo2 = ses.phaseLikes[cat].p2.filter(id => !inMenu.has(id) && solo1.indexOf(id) < 0);

  while (ses.liked[cat].length < ses.targets[cat] && (solo1.length || solo2.length)) {

function undoLocalSwipe() {
  const ses = S.session;
  if (!ses || !ses.undo || ses.mode === "duo") return;
  const u = ses.undo;
  if (PHASES[ses.phase].cat !== u.cat || ses.idx <= 0) { ses.undo = null; save.session(); return; }
  ses.idx -= 1;
  if (u.liked) {
    const arr = ses.liked[u.cat];
    const k = arr.lastIndexOf(u.id);
    if (k >= 0) arr.splice(k, 1);
    if (u.superLike) {
      delete ses.chosenBy[u.id];
      if (ses.superUsed && ses.superUsed.solo) delete ses.superUsed.solo[u.cat];
    }
  }
  // la carte reprise doit revenir sur le dessus de la pile
  const q = ses.queues[u.cat];
  const p = q.indexOf(u.id);
  if (p !== ses.idx && p >= 0) { q.splice(p, 1); q.splice(ses.idx, 0, u.id); }
  ses.undo = null;
  save.session(); render(); toast("La carte est revenue — à vous de rejouer");

function reordonneFile(cat) {
  const ses = S.session;
  if (!ses || typeof PRIX === "undefined") return;
  const reste = ses.queues[cat].slice(ses.idx);
  if (reste.length < 3) return;
  const deja = dejaRetenues();
  if (!deja.length) return;
  const serre = budgetSerre();
  const base = factureDe(deja).reel;
  const note = reste.map((id, i) => {
    const r = byId[id];
    if (!r) return { id, s: -1e9, i };
    const marg = Math.max(0, factureDe(deja.concat([r])).reel - base);
    const synergie = coutSeul(r) - marg;
    return { id, s: serre ? -marg : synergie, i };
  });
  note.sort((a, b) => (b.s - a.s) || (a.i - b.i));
  ses.queues[cat] = ses.queues[cat].slice(0, ses.idx).concat(note.map(x => x.id));

/* ================= BUDGET & ANTI-GASPI ================= */
const CUILLERES = { "c. à soupe": 15, "c. à café": 5, "pincée": 1 };
const CUILLERES_P = { "c. à soupe": 0.1, "c. à café": 0.05, "pincée": 0.01 };
const RAYONS_GARDE = { "Épicerie salée": 1, "Épicerie sucrée": 1 };   // au prorata : on ne rachète pas le sel chaque semaine
const RAYONS_VRAC = { "Fruits & Légumes": 1 };                        // au poids, à la pièce près
function prixDe(nom) { return (typeof PRIX !== "undefined" && PRIX[normNom(nom)]) || null; }
function quantiteBase(e, qte, unite) {
  const u = String(unite || "").trim(), q = Number(qte) || 0;
  if (u === "g" || u === "ml") return q;
  if (u === "kg" || u === "litre") return q * 1000;
  const gu = e.gu || {};
  if (gu[u] != null) return q * gu[u];
  if (e.b === "p") return u === "pièce" ? q : q * (CUILLERES_P[u] || 0.1);
  if (CUILLERES[u] != null) return q * CUILLERES[u];
  return q * 100;
}
function coutBase(e, base) { return e.b === "p" ? base * e.px : base * e.px / 1000; }
function quantiteAchetee(e, besoin, rayon) {
  if (e.b === "p") return Math.ceil(besoin - 1e-9);
  if (RAYONS_VRAC[rayon]) {
    const pas = (e.gu && e.gu["pièce"]) || 100;
    return Math.ceil((besoin - 1e-9) / pas) * pas;
  }
  const pk = (e.pk || [500]).slice().sort((a, b) => a - b), gros = pk[pk.length - 1];
  const n = Math.floor(besoin / gros), reste = besoin - n * gros;
  if (reste <= 1e-9) return n * gros;
  const couvre = pk.filter(p => p >= reste);
  return n * gros + (couvre.length ? couvre[0] : gros);
}
/* besoins cumulés d'une liste de recettes : { clé: {base, rayon, e} } */
function besoinsDe(recettes) {
  const b = {};
  recettes.forEach(r => (r.ingredients || []).forEach(ing => {
    const e = prixDe(ing.nom); if (!e) return;
    const k = normNom(ing.nom);
    if (!b[k]) b[k] = { base: 0, rayon: ing.rayon, e };
    b[k].base += quantiteBase(e, ing.qte, ing.unite);
  }));
  return b;
}
function factureDeBesoins(b) {
  let reel = 0, conso = 0;
  Object.keys(b).forEach(k => {
    const it = b[k], c = coutBase(it.e, it.base);
    conso += c;
    reel += RAYONS_GARDE[it.rayon] ? c : coutBase(it.e, quantiteAchetee(it.e, it.base, it.rayon));
  });
  return { reel, conso };
}
function factureDe(recettes) { return factureDeBesoins(besoinsDe(recettes)); }
/* coût marginal : ce que la recette ajoute VRAIMENT à la note, sachant le reste du menu */
function coutMarginal(cand, dejaRecettes) {
  const sans = factureDe(dejaRecettes).reel;
  const avec = factureDe(dejaRecettes.concat([cand])).reel;
  return Math.max(0, avec - sans);
}
function coutSeul(r) { return factureDe([r]).reel; }
/* étiquette anti-gaspi : que mutualise cette recette ? */
function antiGaspi(cand, dejaRecettes) {
  if (!dejaRecettes.length) return null;
  const b = besoinsDe(dejaRecettes);
  let meilleur = null;
  (cand.ingredients || []).forEach(ing => {
    const k = normNom(ing.nom), it = b[k];
    if (!it || RAYONS_GARDE[it.rayon]) return;
    const e = it.e, achete = quantiteAchetee(e, it.base, it.rayon), surplus = achete - it.base;
    const ajout = quantiteBase(e, ing.qte, ing.unite);
    if (surplus <= 0 && !RAYONS_VRAC[it.rayon]) {
      // pas de surplus : la recette fait-elle franchir un palier plus gros (donc mieux payé au kilo) ?
      return;
    }
    const absorbe = Math.min(ajout, surplus);
    const gain = coutBase(e, absorbe);
    if (gain > 0.4 && (!meilleur || gain > meilleur.gain)) {
      meilleur = { gain, nom: capFirst(k), reste: surplus, unite: e.b === "p" ? "" : (e.b === "ml" ? " ml" : " g") };
    }
  });
  return meilleur;
}
function eur(x) {
  const v = Math.round(x * 100) / 100;
  return (v < 10 ? v.toFixed(2) : v.toFixed(v % 1 ? 2 : 0)).replace(".", ",") + " €";
}

function aggregate() {

    if (m <= 0) return;
    (r.ingredients || []).forEach(ing => {
      const canon = normNom(ing.nom);
      const key = fbKey(canon);
      if (!map[key]) map[key] = { key, nom: capFirst(canon), parts: {}, rayon: RAYONS.includes(ing.rayon) ? ing.rayon : "Autres" };
      const u = String(ing.unite || "pièce").trim();
      map[key].parts[u] = (map[key].parts[u] || 0) + (Number(ing.qte) || 0) * m;
    });
  });
  const COUNTABLE = { "pièce": 1, "piece": 1, "tranche": 1, "botte": 1, "sachet": 1, "boîte": 1, "boite": 1 };

function fallbackCopy(txt, cb) {

  ta.value = txt; document.body.appendChild(ta); ta.select();

}
/* partage d'un texte : feuille de partage si possible, sinon copie ; seul l'abandon volontaire reste silencieux */
function partagerTexte(txt) {
  const copie = () => {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Message copié — collez-le dans vos SMS"), () => fallbackCopy(txt, () => toast("Message copié")));
    else fallbackCopy(txt, () => toast("Message copié"));
  };
  if (navigator.share) navigator.share({ text: txt }).catch(e => { if (!e || e.name !== "AbortError") copie(); });
  else copie();
}
/* ---------- Sauvegarde / restauration des données locales ---------- */
const BP_PFX = (typeof SIMPLE !== "undefined" && SIMPLE) ? "facile_bp_" : "bp_";
const URL_CONF = "https://mathieubigardpro-afk.github.io/bonne-pioche" + ((typeof SIMPLE !== "undefined" && SIMPLE) ? "-facile" : "") + "/confidentialite.html";
function exportDonnees() {
  const out = { _app: "bonne-pioche", _v: 1 };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(BP_PFX) === 0) out[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return JSON.stringify(out);
}
function copierSauvegarde() {
  const txt = exportDonnees();
  const done = () => toast("Sauvegarde copiée — collez-la dans une note privée. Elle contient votre code secret : gardez-la pour vous", 4400);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function restaurerDonnees(txt) {
  let data;
  try { data = JSON.parse(txt); } catch (e) { toast("Cette sauvegarde n'est pas lisible — vérifiez le texte collé", 3400, "err"); return false; }
  if (!data || data._app !== "bonne-pioche") { toast("Cette sauvegarde n'est pas lisible — vérifiez le texte collé", 3400, "err"); return false; }
  let n = 0;
  try {
    Object.keys(data).forEach(k => {
      if (k.indexOf(BP_PFX) === 0 && typeof data[k] === "string") { localStorage.setItem(k, data[k]); n++; }
    });
  } catch (e) {}
  if (!n) { toast("Cette sauvegarde ne contient rien pour cette application", 3400, "err"); return false; }
  toast("Données restaurées — l'application redémarre");
  setTimeout(() => location.reload(), 900);
  return true;
}

/* ================= SYNCHRO FOYER (Firebase RTDB REST) ================= */
const POLL_MS = (() => { const m = /poll=(\d+)/.exec(location.hash || ""); return m ? +m[1] : 5000; })();
let RC = store.get("bp_remote", null); // {url, code, me}
function remoteOn() { return !!(RC && RC.url && RC.code && RC.me); }
function other(me) { return me === "p1" ? "p2" : "p1"; }
async function fbFetch(url, opts) {
  // délai maxi de 10 s : une requête pendante ne fige jamais l'application
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 10000);
  try { return await fetch(url, Object.assign({}, opts || {}, { signal: ctl.signal })); }
  finally { clearTimeout(t); }
}
const api = {
  base() { return RC.url.replace(/\/+$/, "") + "/rooms/" + encodeURIComponent(RC.code); },
  async get(path) {
    const r = await fbFetch(this.base() + (path ? "/" + path : "") + ".json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  },
  async put(path, val) {
    const r = await fbFetch(this.base() + (path ? "/" + path : "") + ".json", { method: "PUT", body: JSON.stringify(val) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  },
  async patch(path, obj) {
    const r = await fbFetch(this.base() + (path ? "/" + path : "") + ".json", { method: "PATCH", body: JSON.stringify(obj) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
};
function syncErr(e) { setDot("err"); toast("Synchro impossible — vérifiez la connexion, puis réessayez", 3400, "err"); }
function setDot(st) {
  const d = $("#sync-dot"); if (!d) return;
  d.style.display = remoteOn() ? "inline-block" : "none";
  d.style.background = st === "ok" ? "#6B9E4E" : st === "err" ? "#C0392B" : "#C9C1B2";
}
/* écritures granulaires (fire-and-forget) avec garde anti-écrasement :
   tant qu'une écriture est en vol (+ 2,5 s après), le polling n'écrase pas l'état local */
let _pendingWrites = 0, _quietUntil = 0;
/* écritures ratées : mises en file et rejouées avant tout sondage — l'état distant
   n'écrase jamais une action locale tant qu'elle n'a pas été poussée avec succès */
let _retryQ = [];
function tracked(p, retry) {
  _pendingWrites++;
  return p.then(
    v => { _pendingWrites--; _quietUntil = Date.now() + 2500; setDot("ok"); return v; },
    e => {

      creee: new Date().toISOString().slice(0, 10),
      jours: JOURS.map((j, i) => ({ jour: j, dinerId: diners[i] || null })),
      petitsDejs: states.petitdej.liked.slice(),
      collations: states.collation.liked.slice(),
      mult
    };
    // Blend du couple (V1) : calculé ici, uniquement pour un menu validé à distance
    const blend = computeBlend(ses, states);
    if (blend) week.blend = blend;
    const used = [].concat(states.diner.liked, states.petitdej.liked, states.collation.liked);
    const hist = [used].concat(S.hist || []).slice(0, 3);
    try {
      await api.put("week", week);
      await api.put("hist", hist);
      await api.put("courses/checked", null);
      await api.put("session/validated", true);
      S.week = week; S.hist = hist; S.checked = {};
      save.week(); save.hist(); save.checked();
      maybeCountBlend(S.week);
      atlasAdd(used); rsync.atlas();
      if (S.rsession) S.rsession.validated = true;
      _lastRoom = ""; S.tab = "semaine"; render(); burstConfetti();
      toast("Menu du foyer validé — synchronisé sur les deux téléphones", 2800);
    } catch (err) { syncErr(err); b.disabled = false; delete b.dataset.busy; }
  });
  $("#abort-remote2").addEventListener("click", async e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Vraiment tout repiocher ? Appuyez encore une fois"; b.style.color = "var(--tomate)"; return; }
    try { await api.put("session", null); S.rsession = null; _lastRoom = ""; render(); } catch (err) { syncErr(err); }
  });
}
/* ---------- Réglages foyer ---------- */
function connecterFoyer(code, me, nom) {
  RC = { url: FB_DEFAUT, code, me };
  store.set("bp_remote", RC);
  return (async () => {
    const profil = await api.get("profil");
    if (me === "p2" && !(profil && profil.p1 && profil.p1.nom)) {
      const e = new Error("code introuvable"); e.bp = "introuvable"; throw e;
    }
    if (me === "p1" && profil && (profil.p1 || profil.p2)) {
      const e = new Error("code deja pris"); e.bp = "occupe"; throw e;
    }
    await api.put("profil/" + me, { nom });
    const favs = {}; S.favoris.forEach(id => favs[id] = true);
    if (S.favoris.length) await api.patch("favoris", favs);
    if (S.week && !(await api.get("week"))) await api.put("week", S.week);
    closeModal(); startPolling(); _lastRoom = ""; await pollRoom();
    render();
  })().catch(e => {
    RC = null; store.set("bp_remote", null); setDot();
    if (e && e.bp === "introuvable") toast("Ce code est introuvable — vérifiez-le avec l'autre personne, lettre par lettre", 4200);
    else if (!e || e.bp !== "occupe") toast("La connexion n'a pas marché — vérifiez votre accès internet et réessayez", 3400);
    throw e;
  });
}
function codeFacile() {
  const MOTS = ["citron", "basilic", "abricot", "olive", "menthe", "sesame", "miel", "figue", "tomate", "safran", "praline", "noisette",
    "vanille", "cerise", "mangue", "poire", "radis", "thym", "anis", "cacao", "caramel", "muscade", "romarin", "fenouil"];
  const m = () => MOTS[Math.floor(Math.random() * MOTS.length)];
  let a = m(), b = m();
  while (b === a) b = m();
  return a + "-" + b + "-" + Math.floor(10 + Math.random() * 90);
}
function normaliseCode(brut) {
  return (brut || "").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[\s_.,;:]+/g, "-")
    .replace(/[^a-z0-9-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-+|-+$/g, "")
    .replace(/^fac-/, "");
}
